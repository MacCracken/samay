name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:   # reusable: release.yml gates on this CI workflow

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 (pinned — CVE-21)

      - name: Install Cyrius toolchain
        # The cyrius.cyml [package].cyrius pin is the single source of
        # truth for the toolchain version — never hardcode it here. Read
        # the pin and hand it to the canonical upstream installer, which
        # fetches + lays out $HOME/.cyrius/{bin,lib}. Do NOT hand-roll
        # curl+tar+cp — scripts/install.sh is the supported entry point
        # (matches patra / sigil).
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Format + lint
        # `cyrius fmt` and `cyrius lint` take a FILE argument. A bare
        # `cyrius fmt --check` just prints usage and exits 0, so a gate
        # written that way silently checks nothing — loop over the files.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr; do
            if [ -n "$(cyrius fmt "$f" --check 2>&1)" ]; then
              echo "::error file=$f::not canonically formatted (fix: cyrius fmt $f)"
              fail=1
            fi
          done
          for f in src/*.cyr; do
            out="$(cyrius lint "$f" 2>&1)"
            if echo "$out" | grep -qE "^[1-9][0-9]* (warnings|untracked)"; then
              echo "::error file=$f::lint not clean"
              echo "$out"
              fail=1
            fi
          done
          exit $fail

      - name: dist bundle in sync
        # dist/samay.cyr is the ONLY artifact consumers compile, and until
        # v1.0.3 nothing in CI ever looked at it: a source change that forgot
        # `cyrius distlib` shipped a stale bundle. --check exits 1 on drift.
        run: cyrius distlib --check

      - name: Benchmarks
        # Run, but do not gate on timings — the point is that the harness
        # still executes. tests/samay.bcyr was dead (SIGSEGV) from v0.5.0 to
        # v1.0.1 precisely because nothing ever ran it.
        run: cyrius bench tests/samay.bcyr
